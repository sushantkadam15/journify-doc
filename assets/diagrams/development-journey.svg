<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 255" width="1120" height="255" role="img" aria-labelledby="title desc">
<title id="title">Journify development journey</title><desc id="desc">Five stages: discover, design, build, iterate, ship</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8faf6"/><stop offset="1" stop-color="#f0f6f2"/></linearGradient>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="none" stroke="#608677" stroke-width="1.5"/></marker>
</defs>
<rect width="1120" height="255" rx="22" fill="url(#bg)"/>
<text x="36" y="42" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" letter-spacing="2.4" fill="#507364">THE DEVELOPMENT JOURNEY</text><text x="36" y="82" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#1f3d33">From conversation to working product</text><rect x="28" y="110" width="198" height="118" rx="15" fill="#ffffff" stroke="#d6e5da"/><text x="46" y="137" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#618677">01 / DISCOVER</text><text x="46" y="171" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#213f35">Understand</text><text x="46" y="200" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#586e64">An idea at Collision</text><rect x="248" y="110" width="198" height="118" rx="15" fill="#ffffff" stroke="#d6e5da"/><text x="266" y="137" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#618677">02 / DESIGN</text><text x="266" y="171" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#213f35">Shape</text><text x="266" y="200" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#586e64">Collaborate on UX</text><rect x="468" y="110" width="198" height="118" rx="15" fill="#ffffff" stroke="#d6e5da"/><text x="486" y="137" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#618677">03 / BUILD</text><text x="486" y="171" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#213f35">Implement</text><text x="486" y="200" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#586e64">Full-stack delivery</text><rect x="688" y="110" width="198" height="118" rx="15" fill="#ffffff" stroke="#d6e5da"/><text x="706" y="137" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#618677">04 / ITERATE</text><text x="706" y="171" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#213f35">Refine</text><text x="706" y="200" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#586e64">Respond to feedback</text><rect x="908" y="110" width="198" height="118" rx="15" fill="#ffffff" stroke="#d6e5da"/><text x="926" y="137" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#618677">05 / SHIP</text><text x="926" y="171" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#213f35">Deploy</text><text x="926" y="200" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#586e64">AWS-based release</text><path d="M 227 169 H 244" stroke="#608677" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 447 169 H 464" stroke="#608677" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 667 169 H 684" stroke="#608677" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 887 169 H 904" stroke="#608677" stroke-width="2.5" marker-end="url(#arrow)"/>
</svg>