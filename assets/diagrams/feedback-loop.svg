<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 255" width="1120" height="255" role="img" aria-labelledby="title desc">
<title id="title">Journify product feedback loop</title><desc id="desc">Listen to user feedback, decide what to refine, and improve the experience.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8faf6"/><stop offset="1" stop-color="#f0f6f2"/></linearGradient>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="none" stroke="#608677" stroke-width="1.5"/></marker>
</defs>
<rect width="1120" height="255" rx="22" fill="url(#bg)"/>
<text x="36" y="42" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" letter-spacing="2.4" fill="#507364">THE PRODUCT LOOP</text><text x="36" y="82" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#1f3d33">Feedback informed the next iteration</text><rect x="38" y="113" width="315" height="112" rx="15" fill="#ffffff" stroke="#d6e5da"/><text x="56" y="140" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#618677">LISTEN</text><text x="56" y="174" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#213f35">Observe</text><text x="56" y="203" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#586e64">User feedback and testing</text><rect x="403" y="113" width="315" height="112" rx="15" fill="#ffffff" stroke="#d6e5da"/><text x="421" y="140" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#618677">DECIDE</text><text x="421" y="174" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#213f35">Prioritize</text><text x="421" y="203" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#586e64">Find the usability friction</text><rect x="768" y="113" width="315" height="112" rx="15" fill="#ffffff" stroke="#d6e5da"/><text x="786" y="140" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#618677">IMPROVE</text><text x="786" y="174" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#213f35">Refine</text><text x="786" y="203" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#586e64">Adjust the product experience</text><path d="M355 171 H395" stroke="#608677" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M720 171 H760" stroke="#608677" stroke-width="2.5" marker-end="url(#arrow)"/>
</svg>